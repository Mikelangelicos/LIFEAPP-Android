name: Build LIFEAPP v3.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "LIFEAPP-v3.2-source.zip"
      - ".github/workflows/build-lifeapp.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify LIFEAPP v3.2 source
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking LIFEAPP v3.2 source..."
          test -f LIFEAPP-v3.2-source.zip

          echo "ZIP found:"
          ls -lh LIFEAPP-v3.2-source.zip

      - name: Extract LIFEAPP v3.2
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf lifeapp32
          mkdir -p lifeapp32

          unzip -q LIFEAPP-v3.2-source.zip -d lifeapp32

          echo "Project extracted."
          echo
          echo "Files:"
          find lifeapp32 -maxdepth 6 -type f | sort | head -250

      - name: Locate Android project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR="$(find lifeapp32 -type f -name settings.gradle.kts -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify LIFEAPP v3.2 project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo
          echo "Core Android project OK."

          echo
          echo "Checking original LIFEAPP native engine..."

          LIFEAPP_SO="$(find app/src/main -type f -name liblifeapp.so | head -1)"

          if [ -z "$LIFEAPP_SO" ]; then
            echo "ERROR: original liblifeapp.so was not found."
            exit 1
          fi

          echo "Native LIFEAPP engine:"
          echo "$LIFEAPP_SO"
          ls -lh "$LIFEAPP_SO"

          echo
          echo "Checking LIFEAPP launcher icon..."

          LIFEAPP_ICON="$(find app/src/main/res -type f -name ic_launcher.png | head -1)"

          if [ -z "$LIFEAPP_ICON" ]; then
            echo "ERROR: LIFEAPP launcher icon was not found."
            exit 1
          fi

          echo "Launcher icon:"
          echo "$LIFEAPP_ICON"
          ls -lh "$LIFEAPP_ICON"

          echo
          echo "Checking LIFEAPP v3.2 Java layer..."

          JAVA_COUNT="$(find app/src/main -type f -name '*.java' | wc -l)"

          echo "Java source files: $JAVA_COUNT"

          if [ "$JAVA_COUNT" -lt 1 ]; then
            echo "ERROR: LIFEAPP v3.2 Java layer was not found."
            exit 1
          fi

      - name: Show LIFEAPP version configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "LIFEAPP VERSION CONFIGURATION"
          echo "======================================"

          grep -R \
            -E "versionCode|versionName|applicationId|namespace" \
            app/build.gradle.kts || true

      - name: Build LIFEAPP v3.2 APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "Building LIFEAPP v3.2..."

          gradle :app:assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK generated:"
          echo "$APK"

          ls -lh "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/LIFEAPP-v3.2.apk"

      - name: Verify LIFEAPP v3.2 APK
        shell: bash
        run: |
          set -euxo pipefail

          test -f LIFEAPP-v3.2.apk

          echo
          echo "======================================"
          echo "LIFEAPP v3.2 APK"
          echo "======================================"

          ls -lh LIFEAPP-v3.2.apk

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          fi

          echo
          echo "Using AAPT:"
          echo "$AAPT"

          echo
          echo "======================================"
          echo "PACKAGE / VERSION / LAUNCHER"
          echo "======================================"

          "$AAPT" dump badging LIFEAPP-v3.2.apk | \
            grep -E "package:|application-label:|application-icon|launchable-activity"

          echo
          echo "======================================"
          echo "NATIVE LIFEAPP ENGINE"
          echo "======================================"

          unzip -l LIFEAPP-v3.2.apk | \
            grep "liblifeapp.so"

          echo
          echo "======================================"
          echo "JAVA / DEX LAYER"
          echo "======================================"

          unzip -l LIFEAPP-v3.2.apk | \
            grep -E "classes.*dex" || true

          echo
          echo "======================================"
          echo "ICON RESOURCES"
          echo "======================================"

          unzip -l LIFEAPP-v3.2.apk | \
            grep -E "ic_launcher|resources.arsc" || true

      - name: Upload LIFEAPP v3.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEAPP-v3.2-APK
          path: LIFEAPP-v3.2.apk
          if-no-files-found: error
          retention-days: 30
