name: Build LIFEAPP v3.1 Restored

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "LIFEAPP-v3.1-restored-project.zip"
      - ".github/workflows/build-lifeapp.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify LIFEAPP project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking LIFEAPP v3.1 project..."
          test -f LIFEAPP-v3.1-restored-project.zip

          echo "ZIP found:"
          ls -lh LIFEAPP-v3.1-restored-project.zip

      - name: Extract LIFEAPP v3.1 project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf restored
          mkdir -p restored

          unzip -q LIFEAPP-v3.1-restored-project.zip -d restored

          echo "Project extracted."
          echo
          echo "Project files:"
          find restored -maxdepth 5 -type f | sort | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR="$(find restored -type f -name settings.gradle.kts -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          echo "Android project located at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify restored LIFEAPP files
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "Checking Android project..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo
          echo "Checking original LIFEAPP native library..."

          LIFEAPP_SO="$(find app/src/main -type f -name liblifeapp.so | head -1)"

          if [ -z "$LIFEAPP_SO" ]; then
            echo "ERROR: liblifeapp.so was not found."
            exit 1
          fi

          echo "Found:"
          echo "$LIFEAPP_SO"
          ls -lh "$LIFEAPP_SO"

          echo
          echo "Checking original LIFEAPP launcher icon..."

          LIFEAPP_ICON="$(find app/src/main/res -type f -name ic_launcher.png | head -1)"

          if [ -z "$LIFEAPP_ICON" ]; then
            echo "ERROR: ic_launcher.png was not found."
            exit 1
          fi

          echo "Found:"
          echo "$LIFEAPP_ICON"
          ls -lh "$LIFEAPP_ICON"

      - name: Build LIFEAPP v3.1 APK
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "Building LIFEAPP v3.1..."
          gradle :app:assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"
          ls -lh "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/LIFEAPP-v3.1-restored.apk"

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail

          test -f LIFEAPP-v3.1-restored.apk

          echo
          echo "======================================"
          echo "LIFEAPP v3.1 APK"
          echo "======================================"

          ls -lh LIFEAPP-v3.1-restored.apk

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          fi

          echo
          echo "Using AAPT:"
          echo "$AAPT"

          echo
          echo "======================================"
          echo "PACKAGE / VERSION / LAUNCHER"
          echo "======================================"

          "$AAPT" dump badging LIFEAPP-v3.1-restored.apk | \
            grep -E "package:|application-label:|application-icon|launchable-activity"

          echo
          echo "======================================"
          echo "NATIVE LIFEAPP LIBRARY"
          echo "======================================"

          unzip -l LIFEAPP-v3.1-restored.apk | \
            grep "liblifeapp.so"

          echo
          echo "======================================"
          echo "ICON RESOURCES"
          echo "======================================"

          unzip -l LIFEAPP-v3.1-restored.apk | \
            grep -E "ic_launcher|resources.arsc" || true

      - name: Upload LIFEAPP v3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEAPP-v3.1-restored-APK
          path: LIFEAPP-v3.1-restored.apk
          if-no-files-found: error
          retention-days: 30
