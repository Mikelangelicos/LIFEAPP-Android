name: Build LIFEAPP

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-lifeapp.yml"

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LIFEAPP
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lifeapp-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify LIFEAPP source
        run: |
          echo "=== LIFEAPP SOURCE ==="
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/jniLibs/arm64-v8a/liblifeapp.so
          find app/src/main -maxdepth 8 -type f | sort

      - name: Build LIFEAPP
        run: gradle :app:assembleDebug --stacktrace

      - name: Show signing certificate
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android | grep -E "SHA256:|Owner:|Valid from:" || true

      - name: Prepare APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" LIFEAPP-latest.apk

          echo "=== APK ==="
          ls -lh LIFEAPP-latest.apk

      - name: Upload LIFEAPP APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEAPP-APK
          path: LIFEAPP-latest.apk
          retention-days: 30
          if-no-files-found: error
