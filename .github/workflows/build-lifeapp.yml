name: Build LIFEAPP Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Android SDK: $ANDROID_HOME"
          echo "sdkmanager: $SDKMANAGER"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create LIFEAPP Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/app/lifeapp/mobile
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LIFEAPP"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'app.lifeapp.mobile'
              compileSdk 36

              defaultConfig {
                  applicationId 'app.lifeapp.mobile'
                  minSdk 26
                  targetSdk 36
                  versionCode 300
                  versionName '3.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="LIFEAPP"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LIFEAPP">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="white">#FFFFFF</color>
              <color name="life_blue">#3183FF</color>
              <color name="life_purple">#7556F4</color>
              <color name="life_pink">#EE50B8</color>
              <color name="text_primary">#1D2336</color>
              <color name="text_secondary">#697080</color>
              <color name="surface">#F8F9FD</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.LIFEAPP"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#7556F4</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <gradient
                  android:angle="315"
                  android:startColor="#2589FF"
                  android:centerColor="#7558F5"
                  android:endColor="#F252BA" />

          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#FFD95B"
                  android:pathData="M43,22
                                    A11,11 0,1 0,65,22
                                    A11,11 0,1 0,43,22" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M14,77 L39,45 L58,77 Z" />

              <path
                  android:fillColor="#DBEBFF"
                  android:pathData="M43,77 L68,48 L94,77 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M32,54 L39,45 L46,56 L42,54 L39,58 L36,54 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M52,84
                                    C44,73 34,76 37,86
                                    C40,97 49,94 54,87
                                    C52,87 51,86 52,84 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M56,84
                                    C64,73 74,76 71,86
                                    C68,97 59,94 54,87
                                    C56,87 57,86 56,84 Z" />

              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2.5"
                  android:strokeLineCap="round"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M54,7 L54,13
                                    M31,14 L35,19
                                    M77,14 L73,19
                                    M22,34 L29,34
                                    M79,34 L86,34" />

          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item android:drawable="@drawable/ic_launcher_background" />

              <item
                  android:left="14dp"
                  android:top="14dp"
                  android:right="14dp"
                  android:bottom="14dp"
                  android:drawable="@drawable/ic_launcher_foreground" />

          </layer-list>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item android:drawable="@drawable/ic_launcher_background" />

              <item
                  android:left="14dp"
                  android:top="14dp"
                  android:right="14dp"
                  android:bottom="14dp"
                  android:drawable="@drawable/ic_launcher_foreground" />

          </layer-list>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF

          cat > app/src/main/java/app/lifeapp/mobile/MainActivity.java <<'EOF'
          package app.lifeapp.mobile;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.WindowInsets;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private LinearLayout content;
              private TextView headerTitle;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(248, 249, 253));

                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      android.graphics.Insets bars =
                              insets.getInsets(WindowInsets.Type.systemBars());

                      view.setPadding(
                              bars.left,
                              bars.top,
                              bars.right,
                              bars.bottom
                      );

                      return insets;
                  });

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  header.setPadding(dp(22), dp(18), dp(22), dp(14));
                  header.setBackgroundColor(Color.WHITE);

                  headerTitle = text(
                          "LIFEAPP",
                          28,
                          true,
                          Color.rgb(77, 76, 181)
                  );

                  header.addView(headerTitle);

                  TextView subtitle = text(
                          "Tu vida, organizada en un solo lugar",
                          14,
                          false,
                          Color.rgb(105, 112, 128)
                  );

                  LinearLayout.LayoutParams subtitleParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  subtitleParams.topMargin = dp(3);

                  header.addView(subtitle, subtitleParams);

                  root.addView(header);

                  ScrollView scroll = new ScrollView(this);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(18), dp(18), dp(18), dp(20));

                  scroll.addView(content);

                  LinearLayout.LayoutParams scrollParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          );

                  root.addView(scroll, scrollParams);

                  LinearLayout nav = new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  nav.setGravity(Gravity.CENTER);
                  nav.setPadding(dp(8), dp(8), dp(8), dp(8));
                  nav.setBackgroundColor(Color.WHITE);

                  addNav(nav, "Inicio", this::showHome);
                  addNav(nav, "Explorar", this::showExplore);
                  addNav(nav, "ASK LIFE", this::showAsk);
                  addNav(nav, "Perfil", this::showProfile);

                  root.addView(nav);

                  setContentView(root);

                  showHome();
              }

              private void showHome() {
                  headerTitle.setText("LIFEAPP");
                  content.removeAllViews();

                  TextView hero = text(
                          "Pequeños pasos,\ngrandes resultados",
                          25,
                          true,
                          Color.WHITE
                  );

                  hero.setGravity(Gravity.CENTER_VERTICAL);
                  hero.setPadding(dp(22), dp(20), dp(22), dp(20));

                  GradientDrawable heroGradient = new GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          new int[]{
                                  Color.rgb(49, 131, 255),
                                  Color.rgb(117, 86, 244),
                                  Color.rgb(238, 80, 184)
                          }
                  );

                  heroGradient.setCornerRadius(dp(24));
                  hero.setBackground(heroGradient);

                  LinearLayout.LayoutParams heroParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(155)
                          );

                  heroParams.bottomMargin = dp(20);

                  content.addView(hero, heroParams);

                  addTitle("Tu día");

                  addCard(
                          "Actividad",
                          "Buen ritmo · 7.842 pasos"
                  );

                  addCard(
                          "Agenda",
                          "3 eventos para hoy"
                  );

                  addCard(
                          "Objetivos",
                          "72% completado esta semana"
                  );

                  TextView askLife = text(
                          "✦  ASK LIFE",
                          18,
                          true,
                          Color.WHITE
                  );

                  askLife.setGravity(Gravity.CENTER);
                  askLife.setPadding(dp(15), dp(16), dp(15), dp(16));

                  GradientDrawable askGradient = new GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          new int[]{
                                  Color.rgb(47, 130, 247),
                                  Color.rgb(126, 78, 239)
                          }
                  );

                  askGradient.setCornerRadius(dp(22));
                  askLife.setBackground(askGradient);
                  askLife.setOnClickListener(v -> showAsk());

                  LinearLayout.LayoutParams askParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  askParams.topMargin = dp(10);

                  content.addView(askLife, askParams);
              }

              private void showExplore() {
                  headerTitle.setText("Explorar");
                  content.removeAllViews();

                  addTitle("Todo LIFEAPP");

                  String[] modules = {
                          "❤️  Salud",
                          "👨‍👩‍👧‍👦  Familia",
                          "📅  Agenda",
                          "💳  Finanzas",
                          "🎵  Música",
                          "✈️  Viajes",
                          "🛍️  Compras",
                          "🎯  Objetivos"
                  };

                  for (String module : modules) {
                      addCard(
                              module,
                              "Abrir módulo LIFEAPP"
                      );
                  }
              }

              private void showAsk() {
                  headerTitle.setText("ASK LIFE");
                  content.removeAllViews();

                  addTitle("¿Qué necesitas?");

                  TextView description = text(
                          "Tu asistente para organizar salud, familia, agenda, música, viajes, compras y objetivos.",
                          17,
                          false,
                          Color.rgb(71, 78, 96)
                  );

                  LinearLayout.LayoutParams descriptionParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  descriptionParams.bottomMargin = dp(12);

                  content.addView(
                          description,
                          descriptionParams
                  );

                  addAskButton("Pon música para entrenar");
                  addAskButton("¿Qué tengo mañana?");
                  addAskButton("Organízame el próximo viaje");
                  addAskButton("Añade leche a la compra");
              }

              private void showProfile() {
                  headerTitle.setText("Perfil");
                  content.removeAllViews();

                  addTitle("Tu LIFEAPP");

                  addCard(
                          "Cuenta",
                          "LIFEAPP activa"
                  );

                  addCard(
                          "Privacidad",
                          "Tus datos bajo tu control"
                  );

                  addCard(
                          "Sincronización",
                          "Configurar servicios"
                  );
              }

              private void addTitle(String value) {
                  TextView title = text(
                          value,
                          20,
                          true,
                          Color.rgb(29, 35, 54)
                  );

                  title.setPadding(
                          0,
                          0,
                          0,
                          dp(12)
                  );

                  content.addView(title);
              }

              private void addCard(
                      String title,
                      String subtitle
              ) {

                  LinearLayout card = new LinearLayout(this);

                  card.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  card.setPadding(
                          dp(18),
                          dp(15),
                          dp(18),
                          dp(15)
                  );

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.WHITE
                  );

                  background.setCornerRadius(
                          dp(20)
                  );

                  card.setBackground(
                          background
                  );

                  card.addView(
                          text(
                                  title,
                                  17,
                                  true,
                                  Color.rgb(29, 35, 54)
                          )
                  );

                  TextView subtitleView = text(
                          subtitle,
                          14,
                          false,
                          Color.rgb(105, 112, 128)
                  );

                  LinearLayout.LayoutParams subtitleParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  subtitleParams.topMargin = dp(4);

                  card.addView(
                          subtitleView,
                          subtitleParams
                  );

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  params.bottomMargin = dp(11);

                  content.addView(
                          card,
                          params
                  );
              }

              private void addAskButton(
                      String label
              ) {

                  Button button = new Button(this);

                  button.setText(label);
                  button.setAllCaps(false);
                  button.setTextSize(16);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  params.bottomMargin = dp(10);

                  content.addView(
                          button,
                          params
                  );
              }

              private void addNav(
                      LinearLayout parent,
                      String label,
                      Runnable action
              ) {

                  TextView nav = text(
                          label,
                          13,
                          true,
                          Color.rgb(62, 68, 88)
                  );

                  nav.setGravity(Gravity.CENTER);

                  nav.setPadding(
                          dp(3),
                          dp(11),
                          dp(3),
                          dp(11)
                  );

                  nav.setOnClickListener(
                          v -> action.run()
                  );

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1f
                          );

                  parent.addView(
                          nav,
                          params
                  );
              }

              private TextView text(
                      String value,
                      int size,
                      boolean bold,
                      int color
              ) {

                  TextView view =
                          new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);

                  if (bold) {
                      view.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                      );
                  }

                  return view;
              }

              private int dp(int value) {
                  return Math.round(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }
          }
          EOF

      - name: Build LIFEAPP APK with official AAPT2
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug --stacktrace

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            LIFEAPP-v3.0.apk

          ls -lh LIFEAPP-v3.0.apk

      - name: Verify LIFEAPP launcher icon
        shell: bash
        run: |
          set -e

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo
          echo "======================================"
          echo "LIFEAPP PACKAGE"
          echo "======================================"

          "$AAPT" dump badging LIFEAPP-v3.0.apk | \
          grep -E \
          "package:|application-label:|application-icon|launchable-activity"

          echo
          echo "======================================"
          echo "LIFEAPP ICON RESOURCES"
          echo "======================================"

          unzip -l LIFEAPP-v3.0.apk | \
          grep -E \
          "ic_launcher|resources.arsc"

      - name: Upload LIFEAPP APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEAPP-v3.0-APK
          path: LIFEAPP-v3.0.apk
          if-no-files-found: error
          retention-days: 30
